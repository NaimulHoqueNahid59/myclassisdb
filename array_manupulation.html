<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Manupulation</title>
</head>
<body>
    <h1>crud</h1>

    <script>
        let product={id:5, name:"phone",price:1500,img:"phone.jpg", qty:1, description: "good"};
        let products=[
            {id:1, name:"pencile",price:15,img:"pencile.jpg", qty:1, description: "good"},
            {id:2, name:"pen",price:20,img:"pen.jpg", qty:1, description: "good"},
            {id:3, name:"tab",price:15000,img:"tab.jpg", qty:1, description: "good"},
            {id:4, name:"laptop",price:30000,img:"laptop.jpg", qty:1, description: "good"},
        ];
        //read
        products.forEach((product)=>{
            console.log(product.price);
            
        })
        //update 
        products= products.map((product)=>{
            if (product.id==3) {
                return {...product, price:35}
            }
            return product
        })
        console.log(products)
        // delete
        products=products.filter((product)=>{
            return product.id !=4
        })
        console.log("Delete", products);
        // create
      

        
    </script>
</body>
</html>
