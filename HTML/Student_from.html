<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <label for="Name">Full Name :</label>
        <input type="text" placeholder="Enter Your Name" id="Name" name="Name"><br><br>
        <label for="E-mail">E-mail:</label>
        <input type="email" placeholder="Enter Your Email" id="E-mail" name="email"><br><br>
        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass"><br><br>
        <label for="age">Age:<label>
                <input type="number" name="age" id="age"><br><br>
                <label for="dob">Date of Birth:</label>
                <input type="date" name="dob" id="dob"><br><br>
                <label for="Gender">Gender:</label><br>
                <input type="radio" name="radio" id="Radio1">
                <label for="Radio1">Male:</label>
                <input type="radio" name="radio" id="radio2">
                <label for="radio2">Female:</label>
                <input type="radio" name="radio" id="radio3">
                <label for="radio3">Other:</label>
                <br><br>
                <label for="skill">Skills:</label>
                <br>
                <input type="checkbox" name="chakebox" id="HTML">
                <label for="HTML">HTML</label>
                <input type="checkbox" name="chakebox" id="CSS">
                <label for="CSS">CSS</label>
                <input type="checkbox" name="chakebox" id="JAVASCRIPT">
                <label for="JAVASCRIPT">JavaScript</label>
                <br><br>
                <label for="Coun">Country:</label>
                <br>
                <select name="Dropdown" id="Dropdown">
                    <option value="Bangladesh">Bangladesh</option>
                    <option value="Iran">Iran</option>
                    <option value="UAE">UAE</option>
                </select>
                <br><br>
                <label for="Add">Address:</label><br>
                <textarea name="Add" id="Add" cols="20" rows="3"></textarea>
                <br><br>
                <label for="Upload">Upload File:</label><br>
                <input type="file" name="Upload" id="Upload"><br><br>
                <label for="color">color</label><br>
                <input type="color" name="color" id="color"><br><br>
                <label for="Range">Experiance Range (0-10):</label>
                <input type="range" name="Range" id="Range" min="0" max="10">
                <br><br>

                <button type="submit">Submit</button>
    </form>
</body>

</html>
