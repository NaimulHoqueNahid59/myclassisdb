<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Information Form</h1>
    <!-- id, name, email, address, phone number, Class, Subject, Gender,address  -->
    <form action="Index.php" method="post">
        <label for="student_id">Student ID:</label>
        <input type="text" id="student_id" required>
    
        <br/>
        <br/>
        
        <label for="name">Name</label>
        <input type="text" id="name" required>
    
        <br/>
        <br/>

        <label for="email">Email</label>
        <input type="email" id="email" required>            
        <br/>
        <br/>
        <label for="phone">Phone</label>
        <input type="tel" placeholder="+8801*********" pattern="[+88][-][0-9]{3}[0-9]{3}" id="phone">
        <br/>
        <br/>
        
        <label for="class">Class</label>
        <select id="class" required>
            <option value="CSE">CSE</option>
            <option value="EEE">EEE</option>
            <option value="Civil">Civil</option>
            <option value="BBA">BBA</option>
        </select>

        <br/>
        <br/>
        
        <label for="Subject" >Subject</label>
        <label for="English"><input type="checkbox" value="English" name="Subject" id="English">English </label>
        <label for="Physics"><input type="checkbox" value="Physics" name="Subject" id="Physics">Physics</label>
        <label for="Chemistry"><input type="checkbox" value="Chemistry" name="Subject" id="Physics">Chemistry</label>
        <label for="Math"><input type="checkbox" value="Math" name="Subject" id="Math">Math</label>

        <br/>
        <br/>

        <label for="Gender">Gender</label>
        <label for="male"><input type="radio" id="male" value="Male" name="Gender">Male</label>
        <label for="female"><input type="radio" id="female" value="Female" name="Gender">Female</label>


        <br/>
        <br/>
        
        <label for="image">Upload Image</label>
        <input type="file" id="image">

        <br/>
        <br/>

        <label for="dob">Date-of-birth</label>
        <input type="date" name="dob" id="dob">

        <br/>
        <br/>

        <label for="address">Address</label>
        <textarea name="address" id="address" rows="2" cols="10"></textarea>
        <br/>
        <br/>
        <input type="submit">
        <br/>
        <br/>
        <input type="reset">
        <br/>
        <br/>


        <!--
        text 
        password
        chakebox-->

    </form>
</body>
</html>
